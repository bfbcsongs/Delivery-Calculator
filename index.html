<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Miki Table</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px 10px;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
}

.table-box {
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    background: white;
    border: 1px solid #d1d5db;
}

table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
}

th,
td {
    border: 1px solid #d1d5db;
    height: 26px; 
    padding: 2px 4px;
    text-align: center;
    vertical-align: middle;
}

th {
    background: #111827;
    color: white;
    font-size: 13px;
    font-weight: bold;
}

td {
    background: white;
    font-size: 14px;
}

.miki {
    text-align: left;
    padding-left: 12px;
    font-weight: bold;
}

.label-cell {
    font-weight: bold;
    text-align: center;
}

table input {
    width: 85px;
    max-width: 100%;
    height: 22px;
    padding: 2px;
    border: 1px solid #9ca3af;
    border-radius: 4px;
    text-align: center;
    font-size: 14px;
    background: white;
}

.direct-amount-input {
    width: 100% !important;
    height: 24px !important;
    font-weight: bold;
}

table input:focus {
    outline: 2px solid #94a3b8;
}

.amount {
    font-weight: bold;
}

.sync-panel {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    padding: 10px;
    background: #111827;
    border-top: 1px solid #d1d5db;
}

.sync-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.sync-cell label {
    color: white;
    font-size: 11px;
    font-weight: bold;
    margin-bottom: 4px;
    text-transform: uppercase;
}

.sync-cell input {
    width: 100%;
    height: 32px;
    padding: 4px;
    border: 1px solid #9ca3af;
    border-radius: 4px;
    text-align: center;
    font-size: 14px;
    background: white;
}

.clear-btn {
    width: 100%;
    height: 32px;
    margin-top: 19px;
    background: #ef4444;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
}

.clear-btn:hover {
    background: #dc2626;
}

@media (max-width: 400px) {
    body {
        padding: 15px 5px;
    }

    th,
    td {
        height: 24px;
        padding: 2px;
    }

    th {
        font-size: 11px;
    }

    td {
        font-size: 12px;
    }

    table input {
        width: 70px;
        height: 20px;
        font-size: 12px;
    }

    .sync-cell label {
        font-size: 10px;
    }

    .clear-btn {
        font-size: 11px;
    }

    .miki {
        padding-left: 8px;
    }
}
</style>
</head>

<body>

<div class="table-box">

<table>
    <thead>
        <tr>
            <th>Item</th>
            <th>Qty</th>
            <th>Price</th>
            <th>Amount</th>
        </tr>
    </thead>
    <tbody>

    <!-- ROW 1 -->
    <tr>
        <td class="miki">REG</td>
        <td>
            <input type="number" id="qtyReg"
                   min="0" step="any"
                   oninput="syncFromTable('Reg')">
        </td>
        <td>
            <input type="number" id="priceReg"
                   min="0" step="any"
                   value="45"
                   oninput="calculate()">
        </td>
        <td class="amount" id="amountReg">0</td>
    </tr>

    <!-- ROW 2 -->
    <tr>
        <td class="miki">FRESH</td>
        <td>
            <input type="number" id="qtyFresh"
                   min="0" step="any"
                   oninput="syncFromTable('Fresh')">
        </td>
        <td>
            <input type="number" id="priceFresh"
                   min="0" step="any"
                   value="45"
                   oninput="calculate()">
        </td>
        <td class="amount" id="amountFresh">0</td>
    </tr>

    <!-- ROW 3 -->
    <tr>
        <td class="miki">CAB</td>
        <td>
            <input type="number" id="qtyCab"
                   min="0" step="any"
                   oninput="syncFromTable('Cab')">
        </td>
        <td>
            <input type="number" id="priceCab"
                   min="0" step="any"
                   value="40"
                   oninput="calculate()">
        </td>
        <td class="amount" id="amountCab">0</td>
    </tr>

    <!-- ROW 4 -->
    <tr>
        <td class="miki">BO</td>
        <td>
            <input type="number" id="qtyBo"
                   min="0" step="any"
                   oninput="syncFromTable('Bo')">
        </td>
        <td>
            <input type="number" id="priceBo"
                   min="0" step="any"
                   value="45"
                   oninput="calculate()">
        </td>
        <td class="amount" id="amountBo">0</td>
    </tr>

    <!-- ROW 5: TOTAL -->  
    <tr>
        <td class="miki">TOTAL</td>
        <td></td>
        <td></td>
        <td class="amount" id="totalAmount">0</td>
    </tr>

    <!-- ROW 6: BAL (Nakalagay ang BAL sa 3rd column, input sa 4th column) -->
    <tr>
        <td></td>
        <td></td>
        <td class="label-cell">BAL</td>
        <td>
            <input type="number" id="inputBal"
                   min="0" step="any"
                   class="direct-amount-input"
                   oninput="calculate()">
        </td>
    </tr>

    <!-- ROW 7: PAY (Nakalagay ang PAY sa 3rd column, input sa 4th column) -->
    <tr>
        <td></td>
        <td></td>
        <td class="label-cell">PAY</td>
        <td>
            <input type="number" id="inputPay"
                   min="0" step="any"
                   class="direct-amount-input"
                   oninput="calculate()">
        </td>
    </tr>

    <!-- ROW 8: NET TOTAL -->  
    <tr>
        <td class="miki">NET TOTAL</td>
        <td></td>
        <td></td>
        <td class="amount" id="netTotalAmount">0</td>
    </tr>

    </tbody>
</table>

    <!-- 5-COLUMN SYNC PANEL AT THE BOTTOM -->
    <div class="sync-panel">
        <div class="sync-cell">
            <label>Dry</label>
            <input type="number" id="syncDry" min="0" step="any" oninput="syncFromPanel('Dry')">
        </div>
        <div class="sync-cell">
            <label>Fresh</label>
            <input type="number" id="syncFresh" min="0" step="any" oninput="syncFromPanel('Fresh')">
        </div>
        <div class="sync-cell">
            <label>Cab</label>
            <input type="number" id="syncCab" min="0" step="any" oninput="syncFromPanel('Cab')">
        </div>
        <div class="sync-cell">
            <label>BO</label>
            <input type="number" id="syncBo" min="0" step="any" oninput="syncFromPanel('Bo')">
        </div>
        <div class="sync-cell">
            <button class="clear-btn" onclick="clearAllQty()">CLEAR</button>
        </div>
    </div>

</div>

<script>

function getNumber(id) {
    const value = parseFloat(
        document.getElementById(id).value
    );

    return isNaN(value) ? 0 : value;
}

function formatMoney(value) {
    return value.toLocaleString("en-US", {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
    });
}

function syncFromPanel(type) {
    const val = document.getElementById("sync" + type).value;
    const targetId = type === "Dry" ? "qtyReg" : "qty" + type;
    document.getElementById(targetId).value = val;
    calculate();
}

function syncFromTable(type) {
    const targetId = type === "Reg" ? "syncDry" : "sync" + type;
    const val = document.getElementById("qty" + type).value;
    const syncInput = document.getElementById(targetId);
    if (syncInput) {
        syncInput.value = val;
    }
    calculate();
}

function clearAllQty() {
    const qtyIds = ["qtyReg", "qtyFresh", "qtyCab", "qtyBo", "syncDry", "syncFresh", "syncCab", "syncBo", "inputBal", "inputPay"];
    qtyIds.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = "";
    });
    calculate();
}

function calculate() {

    const regQty = getNumber("qtyReg");
    const regPrice = getNumber("priceReg");
    const regAmount = regQty * regPrice;

    const freshQty = getNumber("qtyFresh");
    const freshPrice = getNumber("priceFresh");
    const freshAmount = freshQty * freshPrice;

    const cabQty = getNumber("qtyCab");
    const cabPrice = getNumber("priceCab");
    const cabAmount = cabQty * cabPrice;

    const boQty = getNumber("qtyBo");
    const boPrice = getNumber("priceBo");
    const boAmount = (boQty / 2) * boPrice;

    const balAmount = getNumber("inputBal");
    const payAmount = getNumber("inputPay");

    const total =
        regAmount +
        freshAmount +
        cabAmount -
        boAmount;

    const netTotal =
        total +
        balAmount -
        payAmount;

    document.getElementById("amountReg").textContent = formatMoney(regAmount);
    document.getElementById("amountFresh").textContent = formatMoney(freshAmount);
    document.getElementById("amountCab").textContent = formatMoney(cabAmount);
    document.getElementById("amountBo").textContent = formatMoney(boAmount);
    document.getElementById("totalAmount").textContent = formatMoney(total);
    document.getElementById("netTotalAmount").textContent = formatMoney(netTotal);

    saveData();
}

function saveData() {
    const data = {
        qtyReg: document.getElementById("qtyReg").value,
        priceReg: document.getElementById("priceReg").value,

        qtyFresh: document.getElementById("qtyFresh").value,
        priceFresh: document.getElementById("priceFresh").value,

        qtyCab: document.getElementById("qtyCab").value,
        priceCab: document.getElementById("priceCab").value,

        qtyBo: document.getElementById("qtyBo").value,
        priceBo: document.getElementById("priceBo").value,

        inputBal: document.getElementById("inputBal").value,
        inputPay: document.getElementById("inputPay").value
    };

    localStorage.setItem(
        "miki_table_data",
        JSON.stringify(data)
    );
}

function loadData() {
    const saved = localStorage.getItem("miki_table_data");

    if (!saved) {
        calculate();
        return;
    }

    const data = JSON.parse(saved);

    document.getElementById("qtyReg").value = data.qtyReg || "";
    document.getElementById("syncDry").value = data.qtyReg || "";
    document.getElementById("priceReg").value = data.priceReg || "45";

    document.getElementById("qtyFresh").value = data.qtyFresh || "";
    document.getElementById("syncFresh").value = data.qtyFresh || "";
    document.getElementById("priceFresh").value = data.priceFresh || "45";

    document.getElementById("qtyCab").value = data.qtyCab || "";
    document.getElementById("syncCab").value = data.qtyCab || "";
    document.getElementById("priceCab").value = data.priceCab || "40";

    document.getElementById("qtyBo").value = data.qtyBo || "";
    document.getElementById("syncBo").value = data.qtyBo || "";
    document.getElementById("priceBo").value = data.priceBo || "45";

    document.getElementById("inputBal").value = data.inputBal || "";
    document.getElementById("inputPay").value = data.inputPay || "";

    calculate();
}

window.onload = loadData;

</script>

</body>
</html>
