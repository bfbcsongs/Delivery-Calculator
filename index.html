<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Miki Table & Ledger</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px 10px;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
}

.table-box {
    width: 100%;
    max-width: 600px;
    margin: 0 auto 20px auto;
    background: white;
    border: 1px solid #d1d5db;
}

table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
}

th,
td {
    border: 1px solid #d1d5db;
    height: 26px; 
    padding: 2px 4px;
    text-align: center;
    vertical-align: middle;
}

th {
    background: #111827;
    color: white;
    font-size: 13px;
    font-weight: bold;
}

td {
    background: white;
    font-size: 14px;
}

.miki {
    text-align: left;
    padding-left: 12px;
    font-weight: bold;
}

.label-cell {
    font-weight: bold;
    text-align: center;
}

table input {
    width: 100%;
    max-width: 100%;
    height: 22px;
    padding: 2px;
    border: 1px solid #9ca3af;
    border-radius: 4px;
    text-align: center;
    font-size: 13px;
    background: white;
}

.table-box-2 table input {
    font-size: 11px;
    height: 24px;
}

.table-box-2 table input.name-input {
    text-align: left;
    padding-left: 6px;
}

.table-box-2 table input.readonly-col {
    background: #f9fafb;
    border: none;
}

.table-box-2 th, th.lockable-header {
    font-size: 13px;
    cursor: pointer;
    user-select: none;
}

.direct-amount-input {
    width: 100% !important;
    height: 24px !important;
    font-weight: bold;
}

table input:focus {
    outline: 2px solid #94a3b8;
}

.amount {
    font-weight: bold;
}

.sync-panel {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    padding: 10px;
    background: #111827;
    border-top: 1px solid #d1d5db;
}

.sync-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.sync-cell label {
    color: white;
    font-size: 11px;
    font-weight: bold;
    margin-bottom: 4px;
    text-transform: uppercase;
}

.sync-cell input {
    width: 100%;
    height: 32px;
    padding: 4px;
    border: 1px solid #9ca3af;
    border-radius: 4px;
    text-align: center;
    font-size: 14px;
    background: white;
}

.clear-btn {
    width: 100%;
    height: 32px;
    margin-top: 19px;
    background: #ef4444;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
}

.clear-btn:hover {
    background: #dc2626;
}

@media (max-width: 400px) {
    body {
        padding: 15px 5px;
    }
    th, td {
        height: 24px;
        padding: 2px;
    }
    th {
        font-size: 10px;
    }
    td {
        font-size: 11px;
    }
}
</style>
</head>

<body>

<!-- FIRST TABLE -->
<div class="table-box">
<table>
    <thead>
        <tr>
            <th>Item</th>
            <th>Qty</th>
            <th id="priceLockHeader" class="lockable-header" onclick="handlePriceKeyClick()" title="Tap 5 times to Lock/Unlock Prices">Price 🔑</th>
            <th>Amount</th>
        </tr>
    </thead>
    <tbody>
    <tr>
        <td class="miki">REG</td>
        <td><input type="number" id="qtyReg" min="0" step="any" oninput="syncFromTable('Reg')"></td>
        <td><input type="number" id="priceReg" class="price-input" min="0" step="any" value="45" oninput="calculateMain()"></td>
        <td class="amount" id="amountReg">0</td>
    </tr>
    <tr>
        <td class="miki">FRESH</td>
        <td><input type="number" id="qtyFresh" min="0" step="any" oninput="syncFromTable('Fresh')"></td>
        <td><input type="number" id="priceFresh" class="price-input" min="0" step="any" value="45" oninput="calculateMain()"></td>
        <td class="amount" id="amountFresh">0</td>
    </tr>
    <tr>
        <td class="miki">CAB</td>
        <td><input type="number" id="qtyCab" min="0" step="any" oninput="syncFromTable('Cab')"></td>
        <td><input type="number" id="priceCab" class="price-input" min="0" step="any" value="40" oninput="calculateMain()"></td>
        <td class="amount" id="amountCab">0</td>
    </tr>
    <tr>
        <td class="miki">BO</td>
        <td><input type="number" id="qtyBo" min="0" step="any" oninput="syncFromTable('Bo')"></td>
        <td><input type="number" id="priceBo" class="price-input" min="0" step="any" value="45" oninput="calculateMain()"></td>
        <td class="amount" id="amountBo">0</td>
    </tr>
    <tr>
        <td class="miki">TOTAL</td>
        <td></td>
        <td></td>
        <td class="amount" id="totalAmount">0</td>
    </tr>
    <tr>
        <td></td>
        <td></td>
        <td class="label-cell">BAL</td>
        <td><input type="number" id="inputBal" min="0" step="any" class="direct-amount-input" oninput="calculateMain()"></td>
    </tr>
    <tr>
        <td></td>
        <td></td>
        <td class="label-cell">PAY</td>
        <td><input type="number" id="inputPay" min="0" step="any" class="direct-amount-input" oninput="calculateMain()"></td>
    </tr>
    <tr>
        <td class="miki">NET TOTAL</td>
        <td></td>
        <td></td>
        <td class="amount" id="netTotalAmount">0</td>
    </tr>
    </tbody>
</table>

    <div class="sync-panel">
        <div class="sync-cell">
            <label>Dry</label>
            <input type="number" id="syncDry" min="0" step="any" oninput="syncFromPanel('Dry')">
        </div>
        <div class="sync-cell">
            <label>Fresh</label>
            <input type="number" id="syncFresh" min="0" step="any" oninput="syncFromPanel('Fresh')">
        </div>
        <div class="sync-cell">
            <label>Cab</label>
            <input type="number" id="syncCab" min="0" step="any" oninput="syncFromPanel('Cab')">
        </div>
        <div class="sync-cell">
            <label>BO</label>
            <input type="number" id="syncBo" min="0" step="any" oninput="syncFromPanel('Bo')">
        </div>
        <div class="sync-cell">
            <button class="clear-btn" onclick="clearMainInputs()">CLEAR</button>
        </div>
    </div>
</div>

<!-- SECOND TABLE (8 COLUMNS, 18 ROWS) -->
<div class="table-box table-box-2">
<table>
    <colgroup>
        <col style="width: 20%;">
        <col style="width: 10%;">
        <col style="width: 10%;">
        <col style="width: 10%;">
        <col style="width: 10%;">
        <col style="width: 10%;">
        <col style="width: 10%;">
        <col style="width: 20%;">
    </colgroup>
    <thead>
        <tr>
            <th id="lockHeader" class="lockable-header" onclick="handleKeyClick()" title="Tap 5 times to Lock/Unlock">🔑</th>
            <th>Dry</th>
            <th>Fresh</th>
            <th>Cab</th>
            <th>BO</th>
            <th>Bal</th>
            <th>Pay</th>
            <th>Amount</th>
        </tr>
    </thead>
    <tbody>
        <script>
            for (let i = 1; i <= 16; i++) {
                document.write(`
                    <tr>
                        <td><input type="text" class="name-input" id="ledgerName_${i}" oninput="saveLedger()" onfocus="loadRowToMain(${i})"></td>
                        <td><input type="text" class="readonly-col" id="ledgerDry_${i}" readonly onfocus="loadRowToMain(${i})"></td>
                        <td><input type="text" class="readonly-col" id="ledgerFresh_${i}" readonly onfocus="loadRowToMain(${i})"></td>
                        <td><input type="text" class="readonly-col" id="ledgerCab_${i}" readonly onfocus="loadRowToMain(${i})"></td>
                        <td><input type="text" class="readonly-col" id="ledgerBo_${i}" readonly onfocus="loadRowToMain(${i})"></td>
                        <td><input type="text" class="readonly-col" id="ledgerBal_${i}" readonly onfocus="loadRowToMain(${i})"></td>
                        <td><input type="text" class="readonly-col" id="ledgerPay_${i}" readonly onfocus="loadRowToMain(${i})"></td>
                        <td><input type="text" class="readonly-col amount" id="ledgerAmount_${i}" readonly></td>
                    </tr>
                `);
            }
        </script>
        <!-- Row 18: Net Total Row -->
        <tr>
            <td class="miki">NET TOTAL</td>
            <td></td><td></td><td></td><td></td><td></td><td></td>
            <td class="amount" id="ledgerNetTotal">0</td>
        </tr>
    </tbody>
</table>
</div>

<script>
let activeRow = 1;

let tapCount = 0;
let tapTimer = null;
let isLocked = false;

let priceTapCount = 0;
let priceTapTimer = null;
let isPriceLocked = false;

function handleKeyClick() {
    tapCount++;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(() => {
        tapCount = 0;
    }, 1000);

    if (tapCount >= 5) {
        tapCount = 0;
        isLocked = !isLocked;
        toggleLockState(isLocked);
    }
}

function toggleLockState(locked) {
    const header = document.getElementById("lockHeader");
    header.textContent = locked ? "🔒" : "🔑";

    const nameInputs = document.querySelectorAll(".name-input");
    nameInputs.forEach(field => {
        field.readOnly = locked;
        field.style.backgroundColor = locked ? "#e5e7eb" : "white";
    });
}

function handlePriceKeyClick() {
    priceTapCount++;
    clearTimeout(priceTapTimer);
    priceTapTimer = setTimeout(() => {
        priceTapCount = 0;
    }, 1000);

    if (priceTapCount >= 5) {
        priceTapCount = 0;
        isPriceLocked = !isPriceLocked;
        togglePriceLockState(isPriceLocked);
    }
}

function togglePriceLockState(locked) {
    const header = document.getElementById("priceLockHeader");
    header.textContent = locked ? "Price 🔒" : "Price 🔑";

    const priceInputs = document.querySelectorAll(".price-input");
    priceInputs.forEach(field => {
        field.readOnly = locked;
        field.style.backgroundColor = locked ? "#e5e7eb" : "white";
    });
}

function getVal(id) {
    const val = parseFloat(document.getElementById(id).value);
    return isNaN(val) ? 0 : val;
}

function formatMoney(value) {
    return value.toLocaleString("en-US", {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
    });
}

function syncFromPanel(type) {
    const val = document.getElementById("sync" + type).value;
    const targetId = type === "Dry" ? "qtyReg" : "qty" + type;
    document.getElementById(targetId).value = val;
    calculateMain();
}

function syncFromTable(type) {
    const targetId = type === "Reg" ? "syncDry" : "sync" + type;
    const val = document.getElementById("qty" + type).value;
    const syncInput = document.getElementById(targetId);
    if (syncInput) {
        syncInput.value = val;
    }
    calculateMain();
}

function clearMainInputs() {
    document.getElementById("qtyReg").value = "";
    document.getElementById("syncDry").value = "";
    document.getElementById("qtyFresh").value = "";
    document.getElementById("syncFresh").value = "";
    document.getElementById("qtyCab").value = "";
    document.getElementById("syncCab").value = "";
    document.getElementById("qtyBo").value = "";
    document.getElementById("syncBo").value = "";
    document.getElementById("inputBal").value = "";
    document.getElementById("inputPay").value = "";
    calculateMain();
}

function calculateMain() {
    const regQty = getVal("qtyReg");
    const regPrice = getVal("priceReg");
    const regAmount = regQty * regPrice;

    const freshQty = getVal("qtyFresh");
    const freshPrice = getVal("priceFresh");
    const freshAmount = freshQty * freshPrice;

    const cabQty = getVal("qtyCab");
    const cabPrice = getVal("priceCab");
    const cabAmount = cabQty * cabPrice;

    const boQty = getVal("qtyBo");
    const boPrice = getVal("priceBo");
    const boAmount = (boQty / 2) * boPrice;

    const balAmount = getVal("inputBal");
    const payAmount = getVal("inputPay");

    const total = regAmount + freshAmount + cabAmount - boAmount;
    const netTotal = total + balAmount - payAmount;

    document.getElementById("amountReg").textContent = formatMoney(regAmount);
    document.getElementById("amountFresh").textContent = formatMoney(freshAmount);
    document.getElementById("amountCab").textContent = formatMoney(cabAmount);
    document.getElementById("amountBo").textContent = formatMoney(boAmount);
    document.getElementById("totalAmount").textContent = formatMoney(total);
    document.getElementById("netTotalAmount").textContent = formatMoney(netTotal);

    document.getElementById(`ledgerDry_${activeRow}`).value = document.getElementById("qtyReg").value;
    document.getElementById(`ledgerFresh_${activeRow}`).value = document.getElementById("qtyFresh").value;
    document.getElementById(`ledgerCab_${activeRow}`).value = document.getElementById("qtyCab").value;
    document.getElementById(`ledgerBo_${activeRow}`).value = document.getElementById("qtyBo").value;
    document.getElementById(`ledgerBal_${activeRow}`).value = document.getElementById("inputBal").value;
    document.getElementById(`ledgerPay_${activeRow}`).value = document.getElementById("inputPay").value;
    document.getElementById(`ledgerAmount_${activeRow}`).value = formatMoney(netTotal);

    calculateLedgerTotals();
    saveLedger();
}

function loadRowToMain(row) {
    activeRow = row;
    document.getElementById("qtyReg").value = document.getElementById(`ledgerDry_${row}`).value;
    document.getElementById("syncDry").value = document.getElementById(`ledgerDry_${row}`).value;

    document.getElementById("qtyFresh").value = document.getElementById(`ledgerFresh_${row}`).value;
    document.getElementById("syncFresh").value = document.getElementById(`ledgerFresh_${row}`).value;

    document.getElementById("qtyCab").value = document.getElementById(`ledgerCab_${row}`).value;
    document.getElementById("syncCab").value = document.getElementById(`ledgerCab_${row}`).value;

    document.getElementById("qtyBo").value = document.getElementById(`ledgerBo_${row}`).value;
    document.getElementById("syncBo").value = document.getElementById(`ledgerBo_${row}`).value;

    document.getElementById("inputBal").value = document.getElementById(`ledgerBal_${row}`).value;
    document.getElementById("inputPay").value = document.getElementById(`ledgerPay_${row}`).value;

    calculateMain();
}

function calculateLedgerTotals() {
    let grandTotal = 0;
    for (let i = 1; i <= 16; i++) {
        const amtStr = document.getElementById(`ledgerAmount_${i}`).value.replace(/,/g, '');
        grandTotal += parseFloat(amtStr) || 0;
    }
    document.getElementById("ledgerNetTotal").textContent = formatMoney(grandTotal);
}

function saveLedger() {
    const ledgerData = {};
    for (let i = 1; i <= 16; i++) {
        ledgerData[`name_${i}`] = document.getElementById(`ledgerName_${i}`).value;
        ledgerData[`dry_${i}`] = document.getElementById(`ledgerDry_${i}`).value;
        ledgerData[`fresh_${i}`] = document.getElementById(`ledgerFresh_${i}`).value;
        ledgerData[`cab_${i}`] = document.getElementById(`ledgerCab_${i}`).value;
        ledgerData[`bo_${i}`] = document.getElementById(`ledgerBo_${i}`).value;
        ledgerData[`bal_${i}`] = document.getElementById(`ledgerBal_${i}`).value;
        ledgerData[`pay_${i}`] = document.getElementById(`ledgerPay_${i}`).value;
        ledgerData[`amount_${i}`] = document.getElementById(`ledgerAmount_${i}`).value;
    }
    localStorage.setItem("miki_ledger_data", JSON.stringify(ledgerData));
}

function loadLedger() {
    const saved = localStorage.getItem("miki_ledger_data");
    if (!saved) return;
    const ledgerData = JSON.parse(saved);

    for (let i = 1; i <= 16; i++) {
        if(ledgerData[`name_${i}`]) document.getElementById(`ledgerName_${i}`).value = ledgerData[`name_${i}`];
        if(ledgerData[`dry_${i}`]) document.getElementById(`ledgerDry_${i}`).value = ledgerData[`dry_${i}`];
        if(ledgerData[`fresh_${i}`]) document.getElementById(`ledgerFresh_${i}`).value = ledgerData[`fresh_${i}`];
        if(ledgerData[`cab_${i}`]) document.getElementById(`ledgerCab_${i}`).value = ledgerData[`cab_${i}`];
        if(ledgerData[`bo_${i}`]) document.getElementById(`ledgerBo_${i}`).value = ledgerData[`bo_${i}`];
        if(ledgerData[`bal_${i}`]) document.getElementById(`ledgerBal_${i}`).value = ledgerData[`bal_${i}`];
        if(ledgerData[`pay_${i}`]) document.getElementById(`ledgerPay_${i}`).value = ledgerData[`pay_${i}`];
        if(ledgerData[`amount_${i}`]) document.getElementById(`ledgerAmount_${i}`).value = ledgerData[`amount_${i}`];
    }
    loadRowToMain(1);
    calculateLedgerTotals();
}

window.onload = loadLedger;
</script>

</body>
</html>
