<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Miki Calculator</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 20px 12px;
        font-family: Arial, sans-serif;
        background: #f3f4f6;
        color: #111827;
    }

    .app {
        max-width: 600px;
        margin: auto;
    }

    h1 {
        text-align: center;
        margin: 5px 0 20px;
        font-size: 24px;
    }

    .table-box {
        background: white;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th {
        background: #111827;
        color: white;
        padding: 12px 6px;
        font-size: 14px;
    }

    td {
        border-bottom: 1px solid #e5e7eb;
        padding: 9px 5px;
        text-align: center;
        font-size: 16px;
    }

    tr:last-child td {
        border-bottom: none;
    }

    .miki {
        font-weight: bold;
        text-align: left;
        padding-left: 12px;
    }

    input {
        width: 100%;
        max-width: 90px;
        padding: 9px 5px;
        border: 1px solid #cbd5e1;
        border-radius: 7px;
        text-align: center;
        font-size: 16px;
        background: white;
    }

    input:focus {
        outline: 2px solid #94a3b8;
        border-color: #64748b;
    }

    .amount {
        font-weight: bold;
    }

    .blank-row td {
        height: 35px;
        border-bottom: none;
    }

    .total-row td {
        background: #e5e7eb;
        font-weight: bold;
        border-top: 2px solid #9ca3af;
    }

    .total-label {
        text-align: left;
        padding-left: 12px;
    }

    .total-amount {
        font-size: 19px;
    }

    .note {
        margin-top: 15px;
        text-align: center;
        font-size: 12px;
        color: #6b7280;
    }

    @media (max-width: 400px) {
        th {
            font-size: 12px;
        }

        td {
            font-size: 14px;
        }

        input {
            max-width: 75px;
            font-size: 14px;
            padding: 8px 3px;
        }

        .total-amount {
            font-size: 17px;
        }
    }
</style>
</head>

<body>

<div class="app">

    <h1>Miki Calculator</h1>

    <div class="table-box">

        <table>
            <thead>
                <tr>
                    <th>Miki</th>
                    <th>Qty</th>
                    <th>Unit Price</th>
                    <th>Amount</th>
                </tr>
            </thead>

            <tbody>

                <!-- REG -->
                <tr>
                    <td class="miki">REG</td>

                    <td>
                        <input
                            type="number"
                            id="qtyReg"
                            min="0"
                            step="any"
                            placeholder=""
                            oninput="calculate()">
                    </td>

                    <td>
                        <input
                            type="number"
                            id="priceReg"
                            min="0"
                            step="any"
                            value="45"
                            oninput="calculate()">
                    </td>

                    <td class="amount" id="amountReg">0.00</td>
                </tr>

                <!-- FRESH -->
                <tr>
                    <td class="miki">FRESH</td>

                    <td>
                        <input
                            type="number"
                            id="qtyFresh"
                            min="0"
                            step="any"
                            placeholder=""
                            oninput="calculate()">
                    </td>

                    <td>
                        <input
                            type="number"
                            id="priceFresh"
                            min="0"
                            step="any"
                            value="45"
                            oninput="calculate()">
                    </td>

                    <td class="amount" id="amountFresh">0.00</td>
                </tr>

                <!-- CAB -->
                <tr>
                    <td class="miki">CAB</td>

                    <td>
                        <input
                            type="number"
                            id="qtyCab"
                            min="0"
                            step="any"
                            placeholder=""
                            oninput="calculate()">
                    </td>

                    <td>
                        <input
                            type="number"
                            id="priceCab"
                            min="0"
                            step="any"
                            value="45"
                            oninput="calculate()">
                    </td>

                    <td class="amount" id="amountCab">0.00</td>
                </tr>

                <!-- BO -->
                <tr>
                    <td class="miki">BO</td>

                    <td>
                        <input
                            type="number"
                            id="qtyBo"
                            min="0"
                            step="any"
                            placeholder=""
                            oninput="calculate()">
                    </td>

                    <td>
                        <input
                            type="number"
                            id="priceBo"
                            min="0"
                            step="any"
                            value="45"
                            oninput="calculate()">
                    </td>

                    <td class="amount" id="amountBo">0.00</td>
                </tr>

                <!-- BLANK ROW -->
                <tr class="blank-row">
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>

                <!-- TOTAL -->
                <tr class="total-row">
                    <td class="total-label">TOTAL</td>
                    <td></td>
                    <td></td>
                    <td class="total-amount" id="totalAmount">0.00</td>
                </tr>

            </tbody>
        </table>

    </div>

    <div class="note">
        Total = REG + FRESH + CAB − BO
    </div>

</div>

<script>

function getNumber(id) {
    const value = parseFloat(document.getElementById(id).value);
    return isNaN(value) ? 0 : value;
}

function formatAmount(value) {
    return value.toLocaleString('en-US', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    });
}

function calculate() {

    // REG
    const qtyReg = getNumber("qtyReg");
    const priceReg = getNumber("priceReg");
    const amountReg = qtyReg * priceReg;

    // FRESH
    const qtyFresh = getNumber("qtyFresh");
    const priceFresh = getNumber("priceFresh");
    const amountFresh = qtyFresh * priceFresh;

    // CAB
    const qtyCab = getNumber("qtyCab");
    const priceCab = getNumber("priceCab");
    const amountCab = qtyCab * priceCab;

    // BO
    const qtyBo = getNumber("qtyBo");
    const priceBo = getNumber("priceBo");
    const amountBo = (qtyBo / 2) * priceBo;

    // TOTAL
    const total = amountReg + amountFresh + amountCab - amountBo;

    // Display
    document.getElementById("amountReg").textContent =
        formatAmount(amountReg);

    document.getElementById("amountFresh").textContent =
        formatAmount(amountFresh);

    document.getElementById("amountCab").textContent =
        formatAmount(amountCab);

    document.getElementById("amountBo").textContent =
        formatAmount(amountBo);

    document.getElementById("totalAmount").textContent =
        formatAmount(total);

    // Save values
    saveData();
}

function saveData() {

    const data = {
        qtyReg: document.getElementById("qtyReg").value,
        priceReg: document.getElementById("priceReg").value,

        qtyFresh: document.getElementById("qtyFresh").value,
        priceFresh: document.getElementById("priceFresh").value,

        qtyCab: document.getElementById("qtyCab").value,
        priceCab: document.getElementById("priceCab").value,

        qtyBo: document.getElementById("qtyBo").value,
        priceBo: document.getElementById("priceBo").value
    };

    localStorage.setItem(
        "miki_calculator_data",
        JSON.stringify(data)
    );
}

function loadData() {

    const saved = localStorage.getItem("miki_calculator_data");

    if (!saved) {
        calculate();
        return;
    }

    const data = JSON.parse(saved);

    document.getElementById("qtyReg").value = data.qtyReg || "";
    document.getElementById("priceReg").value = data.priceReg || "45";

    document.getElementById("qtyFresh").value = data.qtyFresh || "";
    document.getElementById("priceFresh").value = data.priceFresh || "45";

    document.getElementById("qtyCab").value = data.qtyCab || "";
    document.getElementById("priceCab").value = data.priceCab || "45";

    document.getElementById("qtyBo").value = data.qtyBo || "";
    document.getElementById("priceBo").value = data.priceBo || "45";

    calculate();
}

window.onload = loadData;

</script>

</body>
</html>
