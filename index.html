<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Miki Table</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px 10px;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
}

.table-box {
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    background: white;
    border: 1px solid #d1d5db;
}

table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
}

th,
td {
    border: 1px solid #d1d5db;
    height: 52px;
    padding: 6px;
    text-align: center;
    vertical-align: middle;
}

th {
    background: #111827;
    color: white;
    font-size: 14px;
    font-weight: bold;
}

td {
    background: white;
    font-size: 16px;
}

.miki {
    text-align: left;
    padding-left: 12px;
    font-weight: bold;
}

input {
    width: 85px;
    max-width: 100%;
    height: 36px;
    padding: 5px;
    border: 1px solid #9ca3af;
    border-radius: 5px;
    text-align: center;
    font-size: 16px;
    background: white;
}

input:focus {
    outline: 2px solid #94a3b8;
}

.amount {
    font-weight: bold;
}

.total-label {
    text-align: left;
    padding-left: 12px;
    font-weight: bold;
}

.total-amount {
    font-weight: bold;
    font-size: 16px;
}

@media (max-width: 400px) {

    body {
        padding: 15px 5px;
    }

    th,
    td {
        height: 48px;
        padding: 4px;
    }

    th {
        font-size: 12px;
    }

    td {
        font-size: 14px;
    }

    input {
        width: 70px;
        height: 32px;
        font-size: 14px;
    }

    .miki,
    .total-label {
        padding-left: 8px;
    }
}
</style>
</head>

<body>

<div class="table-box">

<table>
    <thead>
        <tr>
            <th>Item</th>
            <th>Qty</th>
            <th>Price</th>
            <th>Amount</th>
        </tr>
    </thead>
    <tbody>

    <!-- ROW 1 -->
    <tr>
        <td class="miki">REG</td>
        <td>
            <input type="number" id="qtyReg"
                   min="0" step="any"
                   oninput="calculate()">
        </td>
        <td>
            <input type="number" id="priceReg"
                   min="0" step="any"
                   value="45"
                   oninput="calculate()">
        </td>
        <td class="amount" id="amountReg">0.00</td>
    </tr>

    <!-- ROW 2 -->
    <tr>
        <td class="miki">FRESH</td>
        <td>
            <input type="number" id="qtyFresh"
                   min="0" step="any"
                   oninput="calculate()">
        </td>
        <td>
            <input type="number" id="priceFresh"
                   min="0" step="any"
                   value="45"
                   oninput="calculate()">
        </td>
        <td class="amount" id="amountFresh">0.00</td>
    </tr>

    <!-- ROW 3 -->
    <tr>
        <td class="miki">CAB</td>
        <td>
            <input type="number" id="qtyCab"
                   min="0" step="any"
                   oninput="calculate()">
        </td>
        <td>
            <input type="number" id="priceCab"
                   min="0" step="any"
                   value="45"
                   oninput="calculate()">
        </td>
        <td class="amount" id="amountCab">0.00</td>
    </tr>

    <!-- ROW 4 -->
    <tr>
        <td class="miki">BO</td>
        <td>
            <input type="number" id="qtyBo"
                   min="0" step="any"
                   oninput="calculate()">
        </td>
        <td>
            <input type="number" id="priceBo"
                   min="0" step="any"
                   value="45"
                   oninput="calculate()">
        </td>
        <td class="amount" id="amountBo">0.00</td>
    </tr>

    <!-- ROW 5: TOTAL -->  
    <tr>
        <td class="miki">TOTAL</td>
        <td></td>
        <td></td>
        <td class="amount" id="totalAmount">0.00</td>
    </tr>

    <!-- ROW 6: BAL (Added) -->
    <tr>
        <td class="miki">BAL</td>
        <td>
            <input type="number" id="qtyBal"
                   min="0" step="any"
                   oninput="calculate()">
        </td>
        <td>
            <input type="number" id="priceBal"
                   min="0" step="any"
                   value="45"
                   oninput="calculate()">
        </td>
        <td class="amount" id="amountBal">0.00</td>
    </tr>

    <!-- ROW 7: PAY (Deducted) -->
    <tr>
        <td class="miki">PAY</td>
        <td>
            <input type="number" id="qtyPay"
                   min="0" step="any"
                   oninput="calculate()">
        </td>
        <td>
            <input type="number" id="pricePay"
                   min="0" step="any"
                   value="45"
                   oninput="calculate()">
        </td>
        <td class="amount" id="amountPay">0.00</td>
    </tr>

    <!-- ROW 8: NET TOTAL -->  
    <tr>
        <td class="miki">NET TOTAL</td>
        <td></td>
        <td></td>
        <td class="amount" id="netTotalAmount">0.00</td>
    </tr>

    </tbody>
</table>

</div>

<script>

function getNumber(id) {
    const value = parseFloat(
        document.getElementById(id).value
    );

    return isNaN(value) ? 0 : value;
}

function formatMoney(value) {
    return value.toLocaleString("en-US", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    });
}

function calculate() {

    const regQty = getNumber("qtyReg");
    const regPrice = getNumber("priceReg");
    const regAmount = regQty * regPrice;

    const freshQty = getNumber("qtyFresh");
    const freshPrice = getNumber("priceFresh");
    const freshAmount = freshQty * freshPrice;

    const cabQty = getNumber("qtyCab");
    const cabPrice = getNumber("priceCab");
    const cabAmount = cabQty * cabPrice;

    const boQty = getNumber("qtyBo");
    const boPrice = getNumber("priceBo");
    const boAmount = (boQty / 2) * boPrice;

    const balQty = getNumber("qtyBal");
    const balPrice = getNumber("priceBal");
    const balAmount = balQty * balPrice;

    const payQty = getNumber("qtyPay");
    const payPrice = getNumber("pricePay");
    const payAmount = payQty * payPrice;

    // TOTAL = REG + FRESH + CAB - BO
    const total =
        regAmount +
        freshAmount +
        cabAmount -
        boAmount;

    // NET TOTAL = TOTAL + BAL - PAY
    const netTotal =
        total +
        balAmount -
        payAmount;

    document.getElementById("amountReg").textContent =
        formatMoney(regAmount);

    document.getElementById("amountFresh").textContent =
        formatMoney(freshAmount);

    document.getElementById("amountCab").textContent =
        formatMoney(cabAmount);

    document.getElementById("amountBo").textContent =
        formatMoney(boAmount);

    document.getElementById("totalAmount").textContent =
        formatMoney(total);

    document.getElementById("amountBal").textContent =
        formatMoney(balAmount);

    document.getElementById("amountPay").textContent =
        formatMoney(payAmount);

    document.getElementById("netTotalAmount").textContent =
        formatMoney(netTotal);

    saveData();
}

function saveData() {

    const data = {
        qtyReg: document.getElementById("qtyReg").value,
        priceReg: document.getElementById("priceReg").value,

        qtyFresh: document.getElementById("qtyFresh").value,
        priceFresh: document.getElementById("priceFresh").value,

        qtyCab: document.getElementById("qtyCab").value,
        priceCab: document.getElementById("priceCab").value,

        qtyBo: document.getElementById("qtyBo").value,
        priceBo: document.getElementById("priceBo").value,

        qtyBal: document.getElementById("qtyBal").value,
        priceBal: document.getElementById("priceBal").value,

        qtyPay: document.getElementById("qtyPay").value,
        pricePay: document.getElementById("pricePay").value
    };

    localStorage.setItem(
        "miki_table_data",
        JSON.stringify(data)
    );
}

function loadData() {

    const saved =
        localStorage.getItem("miki_table_data");

    if (!saved) {
        calculate();
        return;
    }

    const data = JSON.parse(saved);

    document.getElementById("qtyReg").value = data.qtyReg || "";
    document.getElementById("priceReg").value = data.priceReg || "45";

    document.getElementById("qtyFresh").value = data.qtyFresh || "";
    document.getElementById("priceFresh").value = data.priceFresh || "45";

    document.getElementById("qtyCab").value = data.qtyCab || "";
    document.getElementById("priceCab").value = data.priceCab || "45";

    document.getElementById("qtyBo").value = data.qtyBo || "";
    document.getElementById("priceBo").value = data.priceBo || "45";

    document.getElementById("qtyBal").value = data.qtyBal || "";
    document.getElementById("priceBal").value = data.priceBal || "45";

    document.getElementById("qtyPay").value = data.qtyPay || "";
    document.getElementById("pricePay").value = data.pricePay || "45";

    calculate();
}

window.onload = loadData;

</script>

</body>
</html>
