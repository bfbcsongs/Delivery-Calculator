<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Miki Table</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px 10px;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
}

.table-box {
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 3px 12px rgba(0,0,0,0.12);
}

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    background: #111827;
    color: white;
    padding: 12px 6px;
    font-size: 14px;
}

td {
    border-bottom: 1px solid #e5e7eb;
    padding: 9px 5px;
    text-align: center;
    font-size: 16px;
}

.miki {
    text-align: left;
    padding-left: 12px;
    font-weight: bold;
}

input {
    width: 85px;
    max-width: 100%;
    padding: 8px 4px;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
    text-align: center;
    font-size: 16px;
    background: white;
}

input:focus {
    outline: 2px solid #94a3b8;
}

.amount {
    font-weight: bold;
}

.total-row td {
    background: #e5e7eb;
    border-top: 2px solid #9ca3af;
    border-bottom: none;
    font-weight: bold;
}

.total-label {
    text-align: left;
    padding-left: 12px;
}

.total-amount {
    font-size: 18px;
}

@media (max-width: 400px) {

    th {
        font-size: 12px;
        padding: 10px 3px;
    }

    td {
        font-size: 14px;
        padding: 8px 3px;
    }

    input {
        width: 70px;
        font-size: 14px;
    }

    .total-amount {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<div class="table-box">

<table>

    <thead>
        <tr>
            <th>Miki</th>
            <th>Qty</th>
            <th>Unit Price</th>
            <th>Amount</th>
        </tr>
    </thead>

    <tbody>

        <!-- ROW 1 - REG -->
        <tr>
            <td class="miki">REG</td>

            <td>
                <input
                    type="number"
                    id="qtyReg"
                    min="0"
                    step="any"
                    oninput="calculate()">
            </td>

            <td>
                <input
                    type="number"
                    id="priceReg"
                    min="0"
                    step="any"
                    value="45"
                    oninput="calculate()">
            </td>

            <td class="amount" id="amountReg">
                0.00
            </td>
        </tr>

        <!-- ROW 2 - FRESH -->
        <tr>
            <td class="miki">FRESH</td>

            <td>
                <input
                    type="number"
                    id="qtyFresh"
                    min="0"
                    step="any"
                    oninput="calculate()">
            </td>

            <td>
                <input
                    type="number"
                    id="priceFresh"
                    min="0"
                    step="any"
                    value="45"
                    oninput="calculate()">
            </td>

            <td class="amount" id="amountFresh">
                0.00
            </td>
        </tr>

        <!-- ROW 3 - CAB -->
        <tr>
            <td class="miki">CAB</td>

            <td>
                <input
                    type="number"
                    id="qtyCab"
                    min="0"
                    step="any"
                    oninput="calculate()">
            </td>

            <td>
                <input
                    type="number"
                    id="priceCab"
                    min="0"
                    step="any"
                    value="45"
                    oninput="calculate()">
            </td>

            <td class="amount" id="amountCab">
                0.00
            </td>
        </tr>

        <!-- ROW 4 - BO -->
        <tr>
            <td class="miki">BO</td>

            <td>
                <input
                    type="number"
                    id="qtyBo"
                    min="0"
                    step="any"
                    oninput="calculate()">
            </td>

            <td>
                <input
                    type="number"
                    id="priceBo"
                    min="0"
                    step="any"
                    value="45"
                    oninput="calculate()">
            </td>

            <td class="amount" id="amountBo">
                0.00
            </td>
        </tr>

        <!-- ROW 5 - BLANK -->
        <tr>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
        </tr>

        <!-- ROW 6 - TOTAL -->
        <tr class="total-row">
            <td class="total-label">TOTAL</td>
            <td></td>
            <td></td>
            <td class="total-amount" id="totalAmount">
                0.00
            </td>
        </tr>

    </tbody>

</table>

</div>

<script>

function number(id) {
    const value = parseFloat(
        document.getElementById(id).value
    );

    return isNaN(value) ? 0 : value;
}

function money(value) {
    return value.toLocaleString("en-US", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    });
}

function calculate() {

    // REG
    const regQty = number("qtyReg");
    const regPrice = number("priceReg");
    const regAmount = regQty * regPrice;

    // FRESH
    const freshQty = number("qtyFresh");
    const freshPrice = number("priceFresh");
    const freshAmount = freshQty * freshPrice;

    // CAB
    const cabQty = number("qtyCab");
    const cabPrice = number("priceCab");
    const cabAmount = cabQty * cabPrice;

    // BO
    const boQty = number("qtyBo");
    const boPrice = number("priceBo");
    const boAmount = (boQty / 2) * boPrice;

    // TOTAL
    // REG + FRESH + CAB - BO
    const total =
        regAmount +
        freshAmount +
        cabAmount -
        boAmount;

    // Display amounts
    document.getElementById("amountReg").textContent =
        money(regAmount);

    document.getElementById("amountFresh").textContent =
        money(freshAmount);

    document.getElementById("amountCab").textContent =
        money(cabAmount);

    document.getElementById("amountBo").textContent =
        money(boAmount);

    document.getElementById("totalAmount").textContent =
        money(total);

    saveData();
}

function saveData() {

    const data = {
        qtyReg: document.getElementById("qtyReg").value,
        priceReg: document.getElementById("priceReg").value,

        qtyFresh: document.getElementById("qtyFresh").value,
        priceFresh: document.getElementById("priceFresh").value,

        qtyCab: document.getElementById("qtyCab").value,
        priceCab: document.getElementById("priceCab").value,

        qtyBo: document.getElementById("qtyBo").value,
        priceBo: document.getElementById("priceBo").value
    };

    localStorage.setItem(
        "miki_table_data",
        JSON.stringify(data)
    );
}

function loadData() {

    const saved =
        localStorage.getItem("miki_table_data");

    if (!saved) {
        calculate();
        return;
    }

    const data = JSON.parse(saved);

    document.getElementById("qtyReg").value =
        data.qtyReg || "";

    document.getElementById("priceReg").value =
        data.priceReg || "45";

    document.getElementById("qtyFresh").value =
        data.qtyFresh || "";

    document.getElementById("priceFresh").value =
        data.priceFresh || "45";

    document.getElementById("qtyCab").value =
        data.qtyCab || "";

    document.getElementById("priceCab").value =
        data.priceCab || "45";

    document.getElementById("qtyBo").value =
        data.qtyBo || "";

    document.getElementById("priceBo").value =
        data.priceBo || "45";

    calculate();
}

window.onload = loadData;

</script>

</body>
</html>
